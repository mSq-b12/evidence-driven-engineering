name: Bug report
description: Report incorrect skill or packaging behavior
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Describe the behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal prompt, version, and relevant Codex surface. Do not include secrets or private project data.
    validations:
      required: true
